<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private Haven</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Authentication Screen -->
    <div id="auth-screen" class="screen active">
        <div class="auth-card">
            <h2>Romantic Art</h2>
            <div class="haven-title">Our Private Haven</div>
            <p>Enter your email once. Your device will secure and lock it locally.</p>
            <form id="auth-form">
                <input type="email" id="user-email" placeholder="name@example.com" required autocomplete="email">
                <button type="submit" class="btn-primary">Enter Forever Sanctuary</button>
            </form>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="app-screen" class="screen">
        <header class="app-header">
            <button id="back-btn" class="icon-btn">
                <span id="unread-badge" class="badge">0</span>
                ❮
            </button>
            <div class="chat-title-info">
                <span id="chat-partner-name">Admin Support</span>
                <span id="connection-status" class="status-dot online"></span>
            </div>
            <button id="video-call-btn" class="icon-btn">📹</button>
        </header>

        <!-- Chat Messages Container -->
        <div id="chat-container" class="chat-container">
            <!-- Messages load dynamically here -->
        </div>

        <!-- Video Call Modal Layer -->
        <div id="video-modal" class="modal hidden">
            <div class="video-container">
                <video id="remote-video" autoplay playsinline muted></video>
                <div class="video-controls">
                    <button id="end-call-btn" class="btn-danger">End Call</button>
                </div>
            </div>
        </div>

        <!-- Expanding Footer Input -->
        <footer class="chat-footer">
            <div class="input-wrapper">
                <textarea id="message-input" placeholder="Whisper something sweet..." rows="1"></textarea>
                <button id="send-btn" class="send-icon-btn">➤</button>
            </div>
        </footer>

        <!-- Telegram-Style Bottom Navigation -->
        <nav class="telegram-nav">
            <button class="nav-item">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Contacts</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">📞</span>
                <span class="nav-label">Calls</span>
            </button>
            <button class="nav-item active">
                <span class="nav-icon">💬</span>
                <span class="nav-label">Chats</span>
                <span class="nav-badge">13</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">⚙️</span>
                <span class="nav-label">Settings</span>
            </button>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
