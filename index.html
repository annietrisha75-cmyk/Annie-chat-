<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Messenger</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --border: #1e293b;
      --accent: #f43f5e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Setup Modal */
    #setup-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5,7,12,0.95);
      display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
      overflow-y: auto;
    }
    .modal-box {
      background: var(--card-bg); border: 1px solid var(--border); padding: 32px 24px; border-radius: 24px;
      width: 100%; max-width: 420px; box-shadow: 0 25px 50px rgba(0,0,0,0.7); text-align: center;
      margin: auto;
    }
    .modal-box h2 { font-size: 24px; margin-bottom: 12px; color: var(--text); }
    .modal-box p { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5; }
    .input-group { margin-bottom: 20px; text-align: left; }
    .input-group input {
      width: 100%; padding: 14px 16px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); font-size: 16px; outline: none; transition: border-color 0.2s;
    }
    .input-group input:focus { border-color: var(--accent); }
    .btn-primary {
      width: 100%; padding: 14px; background: var(--accent); border: none; border-radius: 12px;
      color: white; font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
    }
    .btn-primary:active { opacity: 0.9; }

    /* Main Chat UI */
    header {
      padding: 16px 20px; background: var(--card-bg); border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .header-info h1 { font-size: 16px; font-weight: 600; }
    .header-info span { font-size: 12px; color: var(--text-muted); }
    
    #chat-container {
      flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
    }
    .message {
      max-width: 80%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-break: break-word;
    }
    .message.user { background: var(--accent); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .message.partner { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); align-self: flex-start; border-bottom-left-radius: 4px; }
    .message img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; }
    .timestamp { font-size: 10px; opacity: 0.7; margin-top: 4px; text-align: right; }

    /* Chat Input Bar */
    .input-bar {
      padding: 16px; background: var(--card-bg); border-top: 1px solid var(--border);
      display: flex; gap: 10px; align-items: center;
    }
    .input-bar input[type="text"] {
      flex: 1; padding: 12px 16px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 24px; color: var(--text); font-size: 14px; outline: none;
    }
    .input-bar input[type="file"] { display: none; }
    .file-btn, .send-btn {
      background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 8px;
    }
    .send-btn { color: var(--accent); font-weight: 600; font-size: 14px; }
  </style>
</head>
<body>

  <!-- Setup Modal (Email Lock) -->
  <div id="setup-modal">
    <div class="modal-box">
      <h2>Our Private Haven</h2>
      <p>Enter your email once. Your device will securely lock it in forever so you never have to sign in again.</p>
      <div class="input-group">
        <input type="email" id="email-input" placeholder="name@example.com">
      </div>
      <button class="btn-primary" onclick="initSession()">Enter Forever Sanctuary</button>
    </div>
  </div>

  <!-- Chat Interface -->
  <header>
    <div class="header-info">
      <h1 id="header-title">Annie & You</h1>
      <span id="header-email"></span>
    </div>
  </header>

  <div id="chat-container"></div>

  <div class="input-bar" id="input-bar" style="display:none;">
    <label class="file-btn" for="media-input">📎</label>
    <input type="file" id="media-input" accept="image/*,video/*">
    <input type="text" id="message-input" placeholder="Whisper something sweet..." onkeypress="handleKeyPress(event)">
    <button class="send-btn" onclick="sendMessage()">Send</button>
  </div>

  <script>
    let userEmail = localStorage.getItem('annie_user_email');

    window.addEventListener('DOMContentLoaded', () => {
      if (userEmail) {
        document.getElementById('setup-modal').style.display = 'none';
        document.getElementById('input-bar').style.display = 'flex';
        document.getElementById('header-email').innerText = userEmail;
        loadLocalMessages();
        syncWithBackend();
      }
    });

    function initSession() {
      const emailInput = document.getElementById('email-input').value.trim();
      if (!emailInput || !emailInput.includes('@')) {
        alert('Please enter a valid email address.');
        return;
      }
      userEmail = emailInput;
      localStorage.setItem('annie_user_email', userEmail);
      
      document.getElementById('setup-modal').style.display = 'none';
      document.getElementById('input-bar').style.display = 'flex';
      document.getElementById('header-email').innerText = userEmail;
      
      loadLocalMessages();
    }

    function getStorageKey() {
      return `annie_messages_${userEmail}`;
    }

    function loadLocalMessages() {
      const container = document.getElementById('chat-container');
      container.innerHTML = '';
      const saved = localStorage.getItem(getStorageKey());
      if (saved) {
        try {
          const messages = JSON.parse(saved);
          messages.forEach(msg => appendMessageToDOM(msg));
        } catch(e) {
          console.error("Error loading local storage", e);
        }
      }
    }

    function saveLocalMessage(msgObj) {
      let saved = localStorage.getItem(getStorageKey());
      let messages = saved ? JSON.parse(saved) : [];
      messages.push(msgObj);
      localStorage.setItem(getStorageKey(), JSON.stringify(messages));
    }

    function appendMessageToDOM(msg) {
      const container = document.getElementById('chat-container');
      const div = document.createElement('div');
      div.className = `message ${msg.sender === 'user' ? 'user' : 'partner'}`;
      
      let content = `<div>${escapeHtml(msg.text || '')}</div>`;
      if (msg.media) {
        content += `<img src="${msg.media}" alt="attachment">`;
      }
      content += `<div class="timestamp">${new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>`;
      
      div.innerHTML = content;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function sendMessage() {
      const textInput = document.getElementById('message-input');
      const fileInput = document.getElementById('media-input');
      const text = textInput.value.trim();
      const file = fileInput.files[0];

      if (!text && !file) return;

      if (file) {
        const reader = new FileReader();
        reader.onload = function(uploadEvent) {
          const msgObj = {
            email: userEmail,
            sender: 'user',
            text: text,
            media: uploadEvent.target.result,
            timestamp: new Date().toISOString()
          };
          saveLocalMessage(msgObj);
          appendMessageToDOM(msgObj);
          postToServer(msgObj);
        };
        reader.readAsDataURL(file);
      } else {
        const msgObj = {
          email: userEmail,
          sender: 'user',
          text: text,
          media: null,
          timestamp: new Date().toISOString()
        };
        saveLocalMessage(msgObj);
        appendMessageToDOM(msgObj);
        postToServer(msgObj);
      }

      textInput.value = '';
      fileInput.value = '';
    }

    function postToServer(msgObj) {
      fetch('/api/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(msgObj)
      }).catch(err => console.error("Sync error:", err));
    }

    function syncWithBackend() {
      fetch(`/api/messages?email=${encodeURIComponent(userEmail)}`)
        .then(res => res.json())
        .then(serverMessages => {
          if (Array.isArray(serverMessages) && serverMessages.length > 0) {
            localStorage.setItem(getStorageKey(), JSON.stringify(serverMessages));
            loadLocalMessages();
          }
        })
        .catch(err => console.error("Fetch sync error:", err));
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
