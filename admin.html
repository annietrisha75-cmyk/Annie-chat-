<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Center - Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
    <!-- Admin Authentication -->
    <div id="admin-auth" class="screen active">
        <div class="auth-card">
            <h2>Owner Control Center</h2>
            <p>Enter Master Password</p>
            <form id="admin-login-form">
                <input type="password" id="admin-pass" placeholder="Password" required>
                <button type="submit" class="btn-primary">Authenticate</button>
            </form>
            <p id="admin-error" class="error-text hidden">Incorrect password. Access denied.</p>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-dashboard" class="screen">
        <header class="admin-header">
            <div class="header-status">
                <span class="status-indicator online"></span> Online
            </div>
            <div class="header-toggle">
                <span class="badge-active">Auto-Translator Active</span>
            </div>
        </header>

        <div class="search-bar-container">
            <input type="text" id="admin-search" placeholder="Search threads by email...">
        </div>

        <div id="thread-list" class="thread-list">
            <!-- Active user threads populate here -->
        </div>

        <!-- Active Conversation & Video Hijack Panel -->
        <div id="admin-workspace" class="workspace hidden">
            <div class="workspace-header">
                <button id="admin-back" class="icon-btn">❮ Back</button>
                <h3 id="active-user-email"></h3>
            </div>
            
            <div class="video-hijack-box">
                <h4>Call & Video Hijack Controls</h4>
                <p>Upload a bypass video file to play when user calls if camera override is disabled.</p>
                <input type="file" id="hijack-video-file" accept="video/*">
                <button id="upload-hijack-btn" class="btn-secondary">Save Override Video</button>
            </div>

            <div id="admin-chat-messages" class="chat-container"></div>
            
            <div class="chat-footer">
                <textarea id="admin-msg-input" placeholder="Reply as admin..." rows="1"></textarea>
                <button id="admin-send-btn" class="send-icon-btn">➤</button>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
