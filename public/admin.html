<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #121212; color: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .box { background: #1c1c1e; padding: 30px; border-radius: 16px; width: 360px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); text-align: center; }
        input, button, select { width: 100%; padding: 12px; margin-top: 12px; border-radius: 8px; border: none; font-size: 15px; outline: none; }
        input, select { background: #2c2c2e; color: #fff; border: 1px solid #444; }
        .btn-primary { background: #2f80ed; color: #fff; font-weight: bold; cursor: pointer; }
        .btn-danger { background: #ff3b30; color: #fff; font-weight: bold; cursor: pointer; }
        #dashboard { display: none; text-align: left; }
        .visitor-card { background: #2c2c2e; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; }
        video { width: 100%; height: 180px; background: #000; border-radius: 8px; object-fit: cover; margin-bottom: 12px; }
    </style>
</head>
<body>

    <!-- PASSWORD GATE -->
    <div class="box" id="loginScreen">
        <h2>Admin Portal</h2>
        <input type="password" id="passwordInput" placeholder="Password (felix123)">
        <button class="btn-primary" id="loginBtn">Login</button>
    </div>

    <!-- ADMIN CONTROLLER DASHBOARD -->
    <div class="box" id="dashboard">
        <h2>Active Control Center</h2>
        <div class="visitor-card" id="visitorStatus">
            <strong>Online Visitor:</strong> <span id="visitorEmailDisplay">Waiting for connection...</span>
        </div>

        <label style="font-size: 13px; color: #aaa;">Select Custom Video File for Call:</label>
        <input type="file" id="videoFilePicker" accept="video/*">

        <!-- Live Admin View Screens -->
        <div style="margin-top: 10px; font-size: 13px; color: #aaa;">Preview Injected Stream:</div>
        <video id="previewVideo" playsinline muted></video>

        <button class="btn-primary" id="sendVideoBtn">Start Call & Send Video</button>
        <button class="btn-danger" id="endCallBtn">Cut Connection</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const loginScreen = document.getElementById('loginScreen');
        const dashboard = document.getElementById('dashboard');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const visitorEmailDisplay = document.getElementById('visitorEmailDisplay');
        const videoFilePicker = document.getElementById('videoFilePicker');
        const previewVideo = document.getElementById('previewVideo');
        const sendVideoBtn = document.getElementById('sendVideoBtn');
        const endCallBtn = document.getElementById('endCallBtn');

        let socket;
        let connectedVisitorId = null;
        let customVideoBlobUrl = '';

        loginBtn.addEventListener('click', async () => {
            const password = passwordInput.value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            const data = await res.json();

            if (data.success) {
                loginScreen.style.display = 'none';
                dashboard.style.display = 'block';
                initAdminSocket();
            } else {
                alert('Invalid Password');
            }
        });

        function initAdminSocket() {
            socket = io();
            socket.emit('join', { email: 'admin@system.local', role: 'admin' });

            socket.on('visitor-online', (data) => {
                connectedVisitorId = data.id;
                visitorEmailDisplay.innerText = data.email;
            });
        }

        videoFilePicker.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                customVideoBlobUrl = URL.createObjectURL(file);
                previewVideo.src = customVideoBlobUrl;
            }
        });

        sendVideoBtn.addEventListener('click', () => {
            if (!connectedVisitorId) {
                alert('No active visitor online right now.');
                return;
            }
            if (!customVideoBlobUrl) {
                alert('Please upload/select a video file first.');
                return;
            }

            previewVideo.currentTime = 0;
            previewVideo.play();

            // Emit command to visitor panel to play the uploaded file clip directly inside the call canvas
            socket.emit('admin-send-video', {
                target: connectedVisitorId,
                videoUrl: customVideoBlobUrl
            });
        });

        endCallBtn.addEventListener('click', () => {
            if (connectedVisitorId) {
                socket.emit('end-call', { target: connectedVisitorId });
            }
            previewVideo.pause();
            alert('Call terminated successfully.');
        });
    </script>
</body>
</html>
