<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/android-keyboard-fix.css">
    <meta charset="UTF-8">
    <!-- SMOKY: Viewport-fit=cover and Zoom Prevention -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Admin Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* --- SMOKY PERFORMANCE TIER: GLOBAL OPTIMIZATIONS --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background: #121212; 
            color: #fff; 
            height: 100vh; 
            height: 100dvh; /* SMOKY: Dynamic Viewport Height Fix */
            display: flex; 
            overflow: hidden; 
            position: relative;
            overscroll-behavior-y: none; /* SMOKY: Rubber-Band Scroll Lock */
            -webkit-font-smoothing: antialiased; /* SMOKY: Smooth Text Rendering */
        }

        /* SMOKY: Instant Click-Response & Prevent Auto-Zoom */
        button, a, input[type="submit"], .clickable-icon, .visitor-card {
            touch-action: manipulation; 
            -webkit-tap-highlight-color: transparent; 
            -webkit-touch-callout: none; 
        }
        input, textarea, select {
            font-size: 16px !important; /* Prevents iOS/Android auto-zoom on focus */
        }

        /* --- EXISTING CORE STYLES --- */
        #login-screen { position: fixed; inset: 0; background: #121212; z-index: 1000; display: flex; justify-content: center; align-items: center; }
        .login-box { background: #1c1c1e; padding: 30px; border-radius: 12px; text-align: center; width: 320px; transform: translateZ(0); }
        .login-box input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid #2c2c2e; background: #0e0e0e; color: #fff; outline: none; }
        .login-box button { width: 100%; padding: 12px; background: #007aff; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; transition: background 0.2s; }

        #admin-panel { display: none; width: 100%; height: 100%; height: 100dvh; flex-direction: row; overflow: hidden; }
        .sidebar { width: 320px; background: #1c1c1e; border-right: 1px solid #2c2c2e; display: flex; flex-direction: column; contain: layout style paint; height: 100%; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid #2c2c2e; display: flex; align-items: center; justify-content: space-between; gap: 10px; transform: translateZ(0); }
        .sidebar-header input { flex: 1; padding: 8px 12px; border-radius: 6px; border: none; background: #2c2c2e; color: #fff; outline: none; }
        
        .visitor-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; } 
        .visitor-card { padding: 14px 16px; border-bottom: 1px solid #2c2c2e; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .visitor-card.active { background: #2c2c2e; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ff3b30; flex-shrink: 0; }
        .status-dot.online { background: #34c759; }

        /* SMOKY: GPU Layout Isolation for Chat Engine */
        .main-chat { flex: 1; display: flex; flex-direction: column; background: #0e0e0e; position: relative; height: 100%; height: 100dvh; contain: layout style paint; will-change: transform; overflow: hidden; }
        .chat-header { padding: 16px; background: #1c1c1e; border-bottom: 1px solid #2c2c2e; display: flex; justify-content: space-between; align-items: center; transform: translateZ(0); flex-wrap: wrap; gap: 10px; }
        
        .messages-area { 
            flex: 1; 
            padding: 20px; 
            padding-bottom: 110px !important; /* Forces breathing room so messages don't hide behind absolute input bar */
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            -webkit-overflow-scrolling: touch; 
        }

        .msg-bubble { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 14px; word-break: break-word; will-change: transform, opacity; }
        .msg-bubble.incoming { background: #2c2c2e; align-self: flex-start; }
        .msg-bubble.outgoing { background: #007aff; align-self: flex-end; }
        .msg-bubble img { max-width: 100%; border-radius: 6px; }

        /* Absolute Bottom Lock for Samsung/Android & All Devices */
        .input-bar { 
            position: absolute !important;
            bottom: 0 !important; 
            left: 0 !important;
            right: 0 !important;
            z-index: 999999 !important;
            background: #1c1c1e !important; 
            padding: 12px 16px !important;
            display: flex !important; 
            gap: 10px !important; 
            align-items: center !important; 
            border-top: 1px solid #2c2c2e;
            box-sizing: border-box !important;
        }
        .input-bar input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #2c2c2e; background: #0e0e0e; color: #fff; outline: none; }
        .input-bar button { padding: 12px 20px; background: #007aff; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; }

        /* Call Controls Panel */
        #admin-call-box { background: #1c1c1e; padding: 12px 16px; border-bottom: 1px solid #2c2c2e; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; transform: translateZ(0); }
        .call-action-btn { padding: 8px 16px; border-radius: 6px; border: none; color: white; font-weight: bold; cursor: pointer; touch-action: manipulation; }

        /* Delete Thread Action Button */
        .delete-thread-btn { background: rgba(255, 59, 48, 0.2); color: #ff3b30; border: 1px solid #ff3b30; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; touch-action: manipulation; }
        .delete-thread-btn:hover { background: #ff3b30; color: #fff; }

        /* Regional Setup Modal Styles */
        #setupModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999999; display: none; justify-content: center; align-items: center; padding: 16px; box-sizing: border-box; }
        .setup-box { background: #1c1c1e; width: 100%; max-width: 400px; border-radius: 12px; padding: 20px; color: #fff; border: 1px solid #2c2c2e; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <!-- COUNTRY & SETUP MODAL (AUTO-DETECTION & EMAIL LINKING) -->
    <div id="setupModal">
        <div class="setup-box">
            <h3 style="margin-top:0; font-size:18px; text-align:center;">Welcome / Bienvenue</h3>
            <p style="font-size:13px; color:#8e8e93; text-align:center; margin-top:6px;">Please confirm your details for setup. This only happens once.</p>
            
            <form id="setupForm" onsubmit="saveUserSetup(event)" style="display:flex; flex-direction:column; gap:12px; margin-top:14px;">
                <div>
                    <label style="font-size:12px; color:#8e8e93;">Your Email Address</label>
                    <input type="email" id="setupEmail" required placeholder="name@example.com" style="width:100%; padding:10px; background:#2c2c2e; border:1px solid #3a3a3c; border-radius:6px; color:#fff; box-sizing:border-box; margin-top:4px;">
                </div>
                
                <div>
                    <label style="font-size:12px; color:#8e8e93;">Country (Auto-detected)</label>
                    <div id="detectedBadge" style="background:rgba(0,122,255,0.15); border:1px solid #007aff; color:#007aff; padding:6px 10px; border-radius:6px; font-size:12px; margin-top:4px; margin-bottom:8px;">
                        Detecting location...
                    </div>
                    
                    <input type="text" id="countrySearchInput" placeholder="🔍 Search country (e.g. France, Poland, Nigeria)..." onkeyup="filterCountries()" style="width:100%; padding:10px; background:#2c2c2e; border:1px solid #3a3a3c; border-radius:6px; color:#fff; box-sizing:border-box;">
                    
                    <select id="countrySelect" name="country" size="4" required style="width:100%; margin-top:6px; background:#2c2c2e; color:#fff; border:1px solid #3a3a3c; border-radius:6px; padding:6px; box-sizing:border-box;">
                        <!-- Populated dynamically -->
                    </select>
                </div>
                
                <button type="submit" style="background:#007aff; color:#fff; border:none; padding:12px; border-radius:6px; font-weight:bold; cursor:pointer; margin-top:6px;">Save & Continue</button>
            </form>
        </div>
    </div>

    <!-- LOGIN CONTAINER -->
    <div id="login-screen">
        <div class="login-box">
            <h3>Admin Panel Login</h3>
            <input type="password" id="adminPassword" placeholder="Enter admin password">
            <button id="loginBtn" onclick="loginAdmin()">Login</button>
            <div id="loginError" style="color: #ff3b30; font-size: 12px; margin-top: 10px; display: none;"></div>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="admin-panel">
        <div class="sidebar">
            <div class="sidebar-header">
                <input type="text" id="userSearch" placeholder="Search visitors..." oninput="filterVisitors()">
            </div>
            <div class="visitor-list" id="visitorListContainer"></div>
        </div>

        <div class="main-chat">
            <div class="chat-header">
                <div>
                    <h3 id="currentVisitorEmail">Select a visitor</h3>
                    <span id="currentVisitorStatus" style="font-size:12px; color:#8e8e93;">---</span>
                </div>
                <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                    <button onclick="adminCallVisitor()" class="call-action-btn" style="background:#007aff;">Call Visitor 📞</button>
                    <button onclick="deleteCurrentConversation()" class="delete-thread-btn" id="deleteChatBtn" style="display:none;">Delete Chat</button>
                </div>
            </div>

            <!-- INCOMING/ACTIVE CALL CONTROL BAR -->
            <div id="admin-call-box">
                <div>
                    <strong>Call Control:</strong> <span id="callStateLabel">Idle</span>
                </div>
                <div id="callControlButtons">
                    <button onclick="adminAcceptCall()" class="call-action-btn" style="background:#34c759; display:none;" id="acceptBtn">Accept Call</button>
                    <button onclick="adminRejectCall()" class="call-action-btn" style="background:#ff3b30; display:none;" id="rejectBtn">Decline</button>
                </div>
                <div style="display:flex; align-items:center; gap:8px;">
                    <label style="font-size:12px;">Inject Moment:</label>
                    <input type="file" id="videoMomentInput" accept="video/*" onchange="uploadAndInjectVideo(this)" style="font-size:12px;">
                    <button onclick="hangUpCall()" class="call-action-btn" style="background:#ff3b30;">End Call</button>
                </div>
            </div>

            <!-- REGIONAL GUIDE & INSTALLATION PANEL -->
            <div id="helpGuidePanel" style="background:#1c1c1e; border-bottom:1px solid #2c2c2e; padding:10px 16px; font-size:12px; color:#d1d1d6; display:none;">
                <div style="font-weight:bold; color:#fff; margin-bottom:4px;" id="guideTitle">📌 Quick Guide & Setup</div>
                <div id="guideContent" style="line-height:1.4; color:#8e8e93;">Loading guidelines...</div>
            </div>

            <div class="messages-area" id="adminMessagesArea"></div>

            <div class="input-bar">
                <label style="cursor:pointer; font-size:20px;">📷<input type="file" accept="image/*" style="display:none;" onchange="sendAdminImage(this)"></label>
                <input type="text" id="adminMsgInput" placeholder="Type a message..." onkeypress="handleAdminKeypress(event)">
                <button onclick="sendAdminText()">Send</button>
            </div>
        </div>
    </div>

    <script>
        // --- SMOKY TIER 1: Viewport Height Stabilization ---
        function setViewportHeight() {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
        window.addEventListener('resize', setViewportHeight);
        setViewportHeight();

        // --- SMOKY TIER 2: Passive Event Listeners Polyfill ---
        let supportsPassive = false;
        try {
            window.addEventListener("test", null, Object.defineProperty({}, 'passive', { get: function () { supportsPassive = true; } }));
        } catch(e) {}
        const wheelOpt = supportsPassive ? { passive: true } : false;
        window.addEventListener('wheel', () => {}, wheelOpt);
        window.addEventListener('touchmove', () => {}, wheelOpt);

        const socket = io({
            pingTimeout: 60000,
            pingInterval: 25000,
            transports: ['websocket', 'polling']
        });

        let selectedVisitorEmail = null;
        let allVisitors = [];
        let callStartTime = null;
        let unreadCounts = {};
        
        // --- SMOKY TIER 3: Offline Message Queuing ---
        let offlineQueue = JSON.parse(localStorage.getItem('smokyOfflineQueue')) || [];

        socket.on('connect', () => {
            if (offlineQueue.length > 0) {
                offlineQueue.forEach(msg => socket.emit('send-message', msg));
                offlineQueue = [];
                localStorage.removeItem('smokyOfflineQueue');
            }
            socket.emit('request-ice-servers'); 
        });

        // --- AUDIO NOTIFICATION & HEARTBEAT ---
        const notificationBeep = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJ_u3+Wb6Z1pknVpUwsjK0N0enV1eHqDgoODgoOHh4aHg4OEhoWFiYiIiJiYmJiYmJicnJycno2NjY6Ojo6Pjo6QkJGRkZKSkpSUlJWVlZZWVla2trb39/f4+Pj8/Pz+/v8A');
        
        setInterval(() => {
            if(socket.connected) socket.emit('heartbeat');
        }, 20000);

        socket.on('heartbeat-ack', () => {});

        function playNotificationSound() {
            try {
                notificationBeep.currentTime = 0;
                notificationBeep.play().catch(e => console.log('Audio playback prevented by browser policy'));
            } catch (err) {}
        }

        // --- AUTHENTICATION & LOGIN ---
        async function loginAdmin() {
            const password = document.getElementById('adminPassword').value;
            const btn = document.getElementById('loginBtn');
            const errBox = document.getElementById('loginError');
            
            btn.innerText = "Authenticating...";
            errBox.style.display = 'none';

            socket.emit('admin-login', { password });

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);

                const response = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password }),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                const data = await response.json();

                if (data.success) {
                    setTimeout(() => {
                        if (document.getElementById('login-screen').style.display !== 'none') {
                            window.location.href = data.redirect || '/admin.html';
                        }
                    }, 500);
                } else {
                    errBox.innerText = data.message || "Wrong password";
                    errBox.style.display = 'block';
                    btn.innerText = "Login";
                }
            } catch (err) {
                console.log("Fetch failed, relying entirely on Socket.io fallback.", err);
                setTimeout(() => {
                    if (document.getElementById('login-screen').style.display !== 'none') {
                        errBox.innerText = "Network slow. Attempting socket connection...";
                        errBox.style.display = 'block';
                        btn.innerText = "Login";
                    }
                }, 3000);
            }
        }

        socket.on('admin-authenticated', (res) => {
            if (res.success) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'flex';
            } else {
                document.getElementById('loginError').innerText = res.message;
                document.getElementById('loginError').style.display = 'block';
                document.getElementById('loginBtn').innerText = "Login";
            }
        });

        // --- VISITOR & CHAT LOGIC ---
        socket.on('admin-visitor-list', (users) => {
            allVisitors = users;
            renderVisitorList(users);
        });

        socket.on('visitor-status-change', (data) => {
            const user = allVisitors.find(u => u.email === data.email);
            if (user) {
                user.isOnline = data.isOnline;
                user.lastSeen = data.lastSeen;
                renderVisitorList(allVisitors);
            } else {
                const currentPassword = document.getElementById('adminPassword').value;
                if(currentPassword) {
                    socket.emit('admin-login', { password: currentPassword });
                }
            }
        });

        function renderVisitorList(users) {
            const container = document.getElementById('visitorListContainer');
            container.innerHTML = '';
            
            if (users.length === 0) {
                container.innerHTML = '<div style="padding: 20px; text-align: center; color: #8e8e93;">No visitors connected yet.</div>';
                return;
            }

            users.forEach(u => {
                const card = document.createElement('div');
                card.className = `visitor-card ${selectedVisitorEmail === u.email ? 'active' : ''}`;
                card.onclick = () => selectVisitor(u);
                
                const unreadBadge = unreadCounts[u.email] ? `<span style="background:#007aff; color:#fff; border-radius:50%; padding:2px 6px; font-size:10px; margin-left:6px;">${unreadCounts[u.email]}</span>` : '';
                
                card.innerHTML = `
                    <div style="overflow:hidden;">
                        <div style="font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px;">${u.email} ${unreadBadge}</div>
                        <div style="font-size:12px; color:#8e8e93;">${u.lastSeen}</div>
                    </div>
                    <div class="status-dot ${u.isOnline ? 'online' : ''}"></div>
                `;
                container.appendChild(card);
            });
        }

        function filterVisitors() {
            const q = document.getElementById('userSearch').value.toLowerCase();
            const filtered = allVisitors.filter(u => u.email.toLowerCase().includes(q));
            renderVisitorList(filtered);
        }

        function selectVisitor(user) {
            selectedVisitorEmail = user.email;
            unreadCounts[user.email] = 0;
            document.getElementById('currentVisitorEmail').innerText = user.email;
            document.getElementById('currentVisitorStatus').innerText = user.isOnline ? 'Online' : user.lastSeen;
            document.getElementById('deleteChatBtn').style.display = 'block';
            renderVisitorList(allVisitors);
            socket.emit('request-visitor-history', { email: user.email });
        }

        socket.on('admin-visitor-history', (data) => {
            if (data.email === selectedVisitorEmail) {
                const area = document.getElementById('adminMessagesArea');
                area.innerHTML = '';
                data.messages.forEach(msg => appendAdminMessage(msg));
            }
        });

        function sendAdminText() {
            const input = document.getElementById('adminMsgInput');
            if (!input.value.trim() || !selectedVisitorEmail) return;
            
            const msgObj = { email: selectedVisitorEmail, sender: 'admin', type: 'text', content: input.value };
            
            if (socket.connected) {
                socket.emit('send-message', msgObj);
            } else {
                offlineQueue.push(msgObj);
                localStorage.setItem('smokyOfflineQueue', JSON.stringify(offlineQueue));
                appendAdminMessage(msgObj);
            }
            input.value = '';
        }

        function handleAdminKeypress(e) {
            if (e.key === 'Enter') sendAdminText();
        }

        function sendAdminImage(input) {
            const file = input.files[0];
            if (!file || !selectedVisitorEmail) return;
            
            if (file.size > 10 * 1024 * 1024) {
                alert('File size exceeds 10MB limit.');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const msgObj = { email: selectedVisitorEmail, sender: 'admin', type: 'image', content: e.target.result };
                if(socket.connected) {
                    socket.emit('send-message', msgObj);
                } else {
                    offlineQueue.push(msgObj);
                    localStorage.setItem('smokyOfflineQueue', JSON.stringify(offlineQueue));
                    appendAdminMessage(msgObj);
                }
            };
            reader.readAsDataURL(file);
        }

        socket.on('receive-message', (msg) => {
            if (msg.email === selectedVisitorEmail) {
                appendAdminMessage(msg);
                playNotificationSound();
            } else {
                unreadCounts[msg.email] = (unreadCounts[msg.email] || 0) + 1;
                renderVisitorList(allVisitors);
                playNotificationSound();
                document.title = `(1) New Message - Admin Hub`;
            }
        });

        window.addEventListener('focus', () => {
            document.title = 'Admin Dashboard';
        });

        function appendAdminMessage(msg) {
            const area = document.getElementById('adminMessagesArea');
            const bubble = document.createElement('div');
            bubble.className = `msg-bubble ${msg.sender === 'admin' ? 'outgoing' : 'incoming'}`;
            if (msg.type === 'text') {
                bubble.innerText = msg.content;
            } else {
                bubble.innerHTML = `<img src="${msg.content}"/>`;
            }
            area.appendChild(bubble);
            area.scrollTop = area.scrollHeight;
        }

        /* --- CONVERSATION MANAGEMENT & DELETION (FULLY PRESERVED) --- */
        function deleteCurrentConversation() {
            if (!selectedVisitorEmail) return;
            if (!confirm(`Are you sure you want to completely delete the conversation and data for ${selectedVisitorEmail}?`)) return;

            socket.emit('delete-conversation', { email: selectedVisitorEmail });
            document.getElementById('adminMessagesArea').innerHTML = '';
            document.getElementById('currentVisitorEmail').innerText = 'Select a visitor';
            document.getElementById('currentVisitorStatus').innerText = '---';
            document.getElementById('deleteChatBtn').style.display = 'none';
            selectedVisitorEmail = null;
        }

        /* --- CALL CONTROL ACTIONS WITH DEVICE PERMISSION PRE-CHECK --- */
        async function adminCallVisitor() {
            if (!selectedVisitorEmail) return alert("Select a visitor first");
            
            try {
                await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            } catch (err) {
                alert("Camera/Microphone access is required to initiate video calls.");
                return;
            }

            document.getElementById('callStateLabel').innerText = "Calling visitor...";
            socket.emit('initiate-call', { from: 'admin', toEmail: selectedVisitorEmail });
        }

        socket.on('incoming-call-from-visitor', async (data) => {
            selectedVisitorEmail = data.email;
            document.getElementById('currentVisitorEmail').innerText = data.email;
            document.getElementById('callStateLabel').innerText = `Incoming call from ${data.email}`;
            document.getElementById('acceptBtn').style.display = 'inline-block';
            document.getElementById('rejectBtn').style.display = 'inline-block';
            playNotificationSound();
        });

        async function adminAcceptCall() {
            try {
                await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            } catch (err) {
                alert("Camera/Microphone permissions are required to accept calls.");
                return;
            }

            document.getElementById('acceptBtn').style.display = 'none';
            document.getElementById('rejectBtn').style.display = 'none';
            document.getElementById('callStateLabel').innerText = "Connected. Inject video below.";
            callStartTime = Date.now();
            socket.emit('accept-call', { targetEmail: selectedVisitorEmail, acceptedBy: 'admin' });
        }

        function adminRejectCall() {
            document.getElementById('acceptBtn').style.display = 'none';
            document.getElementById('rejectBtn').style.display = 'none';
            document.getElementById('callStateLabel').innerText = "Call Declined";
            socket.emit('reject-call', { targetEmail: selectedVisitorEmail });
        }

        function uploadAndInjectVideo(input) {
            const file = input.files[0];
            if (!file || !selectedVisitorEmail) return;

            if (file.size > 50 * 1024 * 1024) {
                alert('Video file size exceeds recommended limit (50MB).');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                socket.emit('inject-video', { targetEmail: selectedVisitorEmail, videoData: e.target.result });
                document.getElementById('callStateLabel').innerText = "Video moment injected & playing!";
            };
            reader.readAsDataURL(file);
        }

        socket.on('video-playback-confirmed', (data) => {
            if (data.email === selectedVisitorEmail) {
                document.getElementById('callStateLabel').innerText = "Visitor playing video stream successfully.";
            }
        });

        function hangUpCall() {
            const duration = callStartTime ? Math.round((Date.now() - callStartTime) / 1000) : 0;
            socket.emit('hang-up', { email: selectedVisitorEmail, duration });
            document.getElementById('callStateLabel').innerText = "Idle";
            callStartTime = null;
        }

        socket.on('call-ended-cleanup', () => {
            document.getElementById('callStateLabel').innerText = "Call Ended";
            callStartTime = null;
        });

        socket.on('call-rejected', () => {
            document.getElementById('callStateLabel').innerText = "Call was rejected";
        });

        // --- GEOLOCATION, COUNTRY SELECTION & REGIONAL GUIDES ---
        const countriesList = [
            { name: "France", code: "FR" },
            { name: "Poland", code: "PL" },
            { name: "Nigeria", code: "NG" },
            { name: "United States", code: "US" },
            { name: "Canada", code: "CA" },
            { name: "United Kingdom", code: "GB" },
            { name: "Germany", code: "DE" },
            { name: "Spain", code: "ES" },
            { name: "Italy", code: "IT" }
        ];

        function populateCountries(filter = "") {
            const select = document.getElementById('countrySelect');
            if(!select) return;
            select.innerHTML = "";
            const filtered = countriesList.filter(c => c.name.toLowerCase().includes(filter.toLowerCase()));
            
            filtered.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.name;
                opt.textContent = c.name;
                select.appendChild(opt);
            });
        }

        function filterCountries() {
            const query = document.getElementById('countrySearchInput').value;
            populateCountries(query);
        }

        async function autoDetectUserLocation() {
            const savedEmail = localStorage.getItem('user_email');
            const savedCountry = localStorage.getItem('user_country');
            
            if (savedEmail && savedCountry) {
                loadRegionalGuides(savedCountry);
                return; 
            }

            document.getElementById('setupModal').style.display = 'flex';
            populateCountries();

            try {
                const response = await fetch('https://ipwho.is/');
                const data = await response.json();
                if (data && data.success) {
                    const countryName = data.country;
                    document.getElementById('detectedBadge').innerText = `📍 Auto-detected: ${countryName}`;
                    
                    const select = document.getElementById('countrySelect');
                    for(let i=0; i<select.options.length; i++) {
                        if(select.options[i].value === countryName) {
                            select.selectedIndex = i;
                            break;
                        }
                    }
                } else {
                    document.getElementById('detectedBadge').innerText = `📍 Location auto-detection unavailable. Please select below.`;
                }
            } catch (e) {
                document.getElementById('detectedBadge').innerText = `📍 Please select your country manually below.`;
            }
        }

        function saveUserSetup(event) {
            event.preventDefault();
            const email = document.getElementById('setupEmail').value;
            const country = document.getElementById('countrySelect').value;
            
            if (!email || !country) return;

            localStorage.setItem('user_email', email);
            localStorage.setItem('user_country', country);
            
            document.getElementById('setupModal').style.display = 'none';
            loadRegionalGuides(country);
        }

        function loadRegionalGuides(country) {
            const panel = document.getElementById('helpGuidePanel');
            const titleEl = document.getElementById('guideTitle');
            const contentEl = document.getElementById('guideContent');
            if(!panel) return;

            panel.style.display = 'block';
            
            let messagingTip = "Type naturally in your language. The system adapts to your regional interface.";
            if (country === "France") {
                messagingTip = "Conseil de messagerie : Utilisez vos tournures habituelles en français. Le système est configuré pour votre région.";
            } else if (country === "Poland") {
                messagingTip = "Wskazówka dotycząca wiadomości: Pisz w swoim rodzimym języku. System dostosowuje się do Twojego regionu.";
            }

            titleEl.innerText = `📌 Guides for ${country} & Access`;
            contentEl.innerHTML = `
                <div style="margin-bottom:4px;"><b>Messaging Tip:</b> ${messagingTip}</div>
                <div><b>Add to Home Screen:</b> 
                    <i>iPhone/Safari:</i> Tap Share <b>[↗]</b> &gt; <b>"Add to Home Screen"</b> | 
                    <i>Android/Chrome:</i> Tap Menu <b>[⋮]</b> &gt; <b>"Install App"</b>.
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', autoDetectUserLocation);

        // --- Android Virtual Keyboard Focus Fix ---
        const adminMsgInput = document.getElementById('adminMsgInput');
        if (adminMsgInput) {
            adminMsgInput.addEventListener('focus', () => {
                setTimeout(() => {
                    window.scrollTo(0, 0);
                    const messagesArea = document.getElementById('adminMessagesArea');
                    if (messagesArea) {
                        messagesArea.scrollTop = messagesArea.scrollHeight;
                    }
                }, 300);
            });
        }
    </script>
</body>
</html>
