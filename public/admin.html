<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Control Center</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.85);
      --border: rgba(212, 175, 55, 0.2);
      --accent: #d4af37;
      --accent-hover: #b38f27;
      --text: #f9fafb;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Auth & Settings Modal */
    #auth-modal {
      position: fixed; inset: 0; background: rgba(5,7,12,0.95); backdrop-filter: blur(16px);
      display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
    }
    .modal-box {
      background: var(--card-bg); border: 1px solid var(--border); padding: 36px; border-radius: 24px;
      width: 100%; max-width: 420px; box-shadow: 0 25px 50px rgba(0,0,0,0.7); text-align: center;
    }
    .modal-box h2 { font-size: 24px; margin-bottom: 8px; color: #fff; font-weight: 700; letter-spacing: 0.5px; }
    .input-group { margin-bottom: 18px; text-align: left; }
    .input-group label { display: block; font-size: 12px; color: var(--accent); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
    .input-group input {
      width: 100%; padding: 14px 18px; background: rgba(0,0,0,0.5); border: 1px solid var(--border);
      border-radius: 12px; color: #fff; font-size: 15px; outline: none; transition: border 0.3s;
    }
    .input-group input:focus { border-color: var(--accent); }
    .btn-primary {
      width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent), var(--accent-hover)); border: none; border-radius: 12px;
      color: #0b0f19; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; box-shadow: 0 4px 15px rgba(212,175,55,0.3);
    }
    .link-btn { background: none; border: none; color: var(--accent); font-size: 13px; cursor: pointer; margin-top: 14px; display: inline-block; text-decoration: underline; }

    /* Header */
    header {
      background: rgba(11, 15, 25, 0.9); border-bottom: 1px solid var(--border); padding: 18px 32px;
      display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { font-size: 20px; font-weight: 700; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; }

    /* Layout */
    .main-layout { display: flex; flex: 1; height: calc(100vh - 73px); overflow: hidden; }
    
    /* Sidebar */
    .sidebar { width: 380px; border-right: 1px solid var(--border); overflow-y: auto; background: rgba(11, 15, 25, 0.6); }
    .user-item {
      padding: 18px 24px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.2s;
    }
    .user-item:hover, .user-item.active { background: rgba(212, 175, 55, 0.08); border-left: 4px solid var(--accent); }
    .user-name { font-weight: 700; font-size: 15px; margin-bottom: 4px; display: flex; justify-content: space-between; color: #fff; }
    .user-preview { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Chat Area */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: radial-gradient(circle at top, rgba(212,175,55,0.03) 0%, transparent 70%); }
    .chat-header { padding: 18px 28px; border-bottom: 1px solid var(--border); background: rgba(11, 15, 25, 0.4); font-weight: 700; display: flex; justify-content: space-between; align-items: center; color: var(--accent); }
    .chat-messages { flex: 1; padding: 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
    .message { max-width: 70%; padding: 14px 18px; border-radius: 16px; font-size: 14px; line-height: 1.6; }
    .message.user { background: rgba(255,255,255,0.05); border: 1px solid var(--border); align-self: flex-start; }
    .message.admin { background: linear-gradient(135deg, var(--accent), var(--accent-hover)); color: #0b0f19; align-self: flex-end; font-weight: 500; box-shadow: 0 4px 15px rgba(212,175,55,0.2); }
    .message img { max-width: 100%; border-radius: 10px; margin-top: 10px; display: block; border: 1px solid rgba(255,255,255,0.1); }
    .translator-badge { font-size: 10px; background: rgba(212,175,55,0.15); color: #fef08a; padding: 3px 8px; border-radius: 6px; display: inline-block; margin-bottom: 6px; font-weight: 600; border: 1px solid rgba(212,175,55,0.3); }

    .chat-input-footer { padding: 20px 28px; border-top: 1px solid var(--border); background: rgba(11, 15, 25, 0.7); display: flex; gap: 14px; }
    .chat-input-footer input { flex: 1; padding: 14px 18px; background: rgba(0,0,0,0.5); border: 1px solid var(--border); border-radius: 12px; color: #fff; outline: none; font-size: 15px; }
    .chat-input-footer input:focus { border-color: var(--accent); }
    .send-btn { background: linear-gradient(135deg, var(--accent), var(--accent-hover)); border: none; padding: 0 24px; border-radius: 12px; color: #0b0f19; font-weight: 700; cursor: pointer; font-size: 15px; box-shadow: 0 4px 15px rgba(212,175,55,0.3); }
  </style>
</head>
<body>

  <!-- Auth Modal -->
  <div id="auth-modal">
    <div class="modal-box" id="login-box">
      <h2>Owner Portal</h2>
      <p style="color:var(--text-muted); font-size:13px; margin-bottom:20px;">Enter security credentials to access encrypted threads.</p>
      <div class="input-group">
        <label>Admin Password</label>
        <input type="password" id="admin-pass" placeholder="Enter password">
      </div>
      <button class="btn-primary" onclick="loginAdmin()">Authorize Access</button>
      <button class="link-btn" onclick="showChangePass(true)">Forgot / Change Password?</button>
    </div>

    <div class="modal-box" id="changepass-box" style="display:none;">
      <h2>Modify Password</h2>
      <p style="color:var(--text-muted); font-size:13px; margin-bottom:20px;">Enter your old correct password and a secure new one.</p>
      <div class="input-group">
        <label>Old Password</label>
        <input type="password" id="old-pass" placeholder="Old password">
      </div>
      <div class="input-group">
        <label>New Password</label>
        <input type="password" id="new-pass" placeholder="New password">
      </div>
      <button class="btn-primary" onclick="changePassword()">Update Password</button>
      <button class="link-btn" onclick="showChangePass(false)">Back to Login</button>
    </div>
  </div>

  <!-- Header -->
  <header>
    <h1>Owner Control Center</h1>
    <div style="font-size:12px; color:var(--text-muted); display:flex; align-items:center; gap:6px;">
      <span style="color:var(--accent);">🌐</span> Telegram-Style Auto-Translator Active
    </div>
  </header>

  <!-- Layout -->
  <div class="main-layout">
    <div class="sidebar" id="user-list"></div>
    <div class="chat-area" id="chat-area">
      <div style="margin:auto; color:var(--text-muted); text-align:center;">
        <h3 style="font-weight:500;">Select an active user thread from the sidebar</h3>
      </div>
    </div>
  </div>

  <script>
    let activeUser = null;
    let pollInterval = null;

    async function loginAdmin() {
      const password = document.getElementById('admin-pass').value;
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('auth-modal').style.display = 'none';
        initDashboard();
      } else {
        alert('Incorrect admin password.');
      }
    }

    function showChangePass(show) {
      document.getElementById('login-box').style.display = show ? 'none' : 'block';
      document.getElementById('changepass-box').style.display = show ? 'block' : 'none';
    }

    async function changePassword() {
      const oldPassword = document.getElementById('old-pass').value;
      const newPassword = document.getElementById('new-pass').value;
      const res = await fetch('/api/admin/change-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ oldPassword, newPassword })
      });
      const data = await res.json();
      if (data.success) {
        alert('Password updated successfully!');
        showChangePass(false);
      } else {
        alert(data.error);
      }
    }

    function initDashboard() {
      loadUsers();
      setInterval(loadUsers, 3000);
    }

    async function loadUsers() {
      const res = await fetch('/api/admin/users');
      const users = await res.json();
      const list = document.getElementById('user-list');
      
      list.innerHTML = users.map(u => `
        <div class="user-item ${activeUser && activeUser.email === u.email ? 'active' : ''}" onclick="selectUser('${u.email}', '${u.name}')">
          <div class="user-name"><span>${u.name}</span><span style="font-size:10px; color:#10b981;">● Online</span></div>
          <div class="user-preview">${u.email}</div>
          <div class="user-preview" style="margin-top:4px; opacity:0.8;">${u.lastMessage}</div>
        </div>
      `).join('');
    }

    async function selectUser(email, name) {
      activeUser = { email, name };
      loadActiveChat();
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(loadActiveChat, 3000);
    }

    async function loadActiveChat() {
      if (!activeUser) return;
      const res = await fetch(`/api/messages/${activeUser.email}`);
      const messages = await res.json();
      
      const area = document.getElementById('chat-area');
      area.innerHTML = `
        <div class="chat-header">
          <span>Active Thread: ${activeUser.name} (${activeUser.email})</span>
        </div>
        <div class="chat-messages" id="admin-msg-box">
          ${messages.map(m => `
            <div class="message ${m.sender === activeUser.name ? 'user' : 'admin'}">
              ${m.sender === activeUser.name ? '<span class="translator-badge">🌐 Auto-Translated to English (Simulated Turkish/Foreign Layer)</span><br>' : ''}
              <div>${m.text}</div>
              ${m.image ? `<img src="${m.image}" />` : ''}
            </div>
          `).join('')}
        </div>
        <div class="chat-input-footer">
          <input type="text" id="admin-reply-input" placeholder="Reply as owner..." onkeypress="if(event.key==='Enter') sendAdminReply()">
          <button class="send-btn" onclick="sendAdminReply()">Send</button>
        </div>
      `;
      const box = document.getElementById('admin-msg-box');
      box.scrollTop = box.scrollHeight;
    }

    async function sendAdminReply() {
      const input = document.getElementById('admin-reply-input');
      const text = input.value.trim();
      if (!text || !activeUser) return;

      await fetch('/api/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: activeUser.email,
          sender: 'Owner',
          text: text
        })
      });

      input.value = '';
      loadActiveChat();
    }
  </script>
</body>
</html>
