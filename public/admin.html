<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Control Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; padding: 2rem; color: #f8fafc; }
        h1 { margin-bottom: 1.5rem; color: #38bdf8; font-size: 1.8rem; }
        #user-list { display: flex; flex-direction: column; gap: 1rem; }
        .user-card { background: #1e293b; padding: 1.2rem; border-radius: 1rem; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); }
        .user-info strong { font-size: 1.1rem; color: #f8fafc; }
        .user-info p { color: #38bdf8; font-size: 0.9rem; margin-top: 2px; }
        .user-info small { color: #94a3b8; }
        a.chat-btn { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; padding: 0.6rem 1.2rem; border-radius: 0.5rem; text-decoration: none; font-weight: bold; font-size: 0.9rem; transition: opacity 0.2s; }
        a.chat-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <h1>Owner Control Center — Active Chats</h1>
    <div id="user-list">Connecting to database...</div>

    <script>
        async function loadUsers() {
            try {
                const res = await fetch('/api/admin/users');
                if (!res.ok) throw new Error('Failed to fetch users');
                const users = await res.json();
                const listDiv = document.getElementById('user-list');
                
                if (users.length === 0) {
                    listDiv.innerHTML = '<p style="color: #94a3b8;">No chats registered yet.</p>';
                    return;
                }

                listDiv.innerHTML = '';
                users.forEach(user => {
                    const card = document.createElement('div');
                    card.className = 'user-card';
                    card.innerHTML = `
                        <div class="user-info">
                            <strong>${user.email}</strong>
                            <p>Name Used: ${user.displayName || 'Private Chat'}</p>
                            <small>Joined: ${new Date(user.createdAt).toLocaleString()}</small>
                        </div>
                        <a href="/?email=${encodeURIComponent(user.email)}" class="chat-btn" target="_blank">Open Chat</a>
                    `;
                    listDiv.appendChild(card);
                });
            } catch (err) {
                document.getElementById('user-list').innerHTML = '<p style="color: #ef4444;">Error loading user list. Retrying...</p>';
                setTimeout(loadUsers, 3000);
            }
        }
        loadUsers();
    </script>
</body>
</html>
