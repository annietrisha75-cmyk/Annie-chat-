<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/android-keyboard-fix.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Admin Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #121212; color: #fff; height: 100vh; height: 100dvh; display: flex; overflow: hidden; position: relative; overscroll-behavior-y: none; -webkit-font-smoothing: antialiased; }
        button, a, input[type="submit"], .clickable-icon, .visitor-card { touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
        input, textarea, select { font-size: 16px !important; }

        #login-screen { position: fixed; inset: 0; background: #121212; z-index: 1000; display: flex; justify-content: center; align-items: center; }
        .login-box { background: #1c1c1e; padding: 30px; border-radius: 12px; text-align: center; width: 320px; transform: translateZ(0); }
        .login-box input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid #2c2c2e; background: #0e0e0e; color: #fff; outline: none; }
        .login-box button { width: 100%; padding: 12px; background: #007aff; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; transition: background 0.2s; }

        #admin-panel { display: none; width: 100%; height: 100%; height: 100dvh; flex-direction: row; overflow: hidden; }
        .sidebar { width: 320px; background: #1c1c1e; border-right: 1px solid #2c2c2e; display: flex; flex-direction: column; contain: layout style paint; height: 100%; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid #2c2c2e; display: flex; align-items: center; justify-content: space-between; gap: 10px; transform: translateZ(0); }
        .sidebar-header input { flex: 1; padding: 8px 12px; border-radius: 6px; border: none; background: #2c2c2e; color: #fff; outline: none; }
        
        .visitor-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; } 
        .visitor-card { padding: 14px 16px; border-bottom: 1px solid #2c2c2e; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .visitor-card.active { background: #2c2c2e; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ff3b30; flex-shrink: 0; }
        .status-dot.online { background: #34c759; }

        .main-chat { flex: 1; display: flex; flex-direction: column; background: #0e0e0e; position: relative; height: 100%; height: 100dvh; contain: layout style paint; will-change: transform; overflow: hidden; }
        .chat-header { padding: 16px; background: #1c1c1e; border-bottom: 1px solid #2c2c2e; display: flex; justify-content: space-between; align-items: center; transform: translateZ(0); flex-wrap: wrap; gap: 10px; }
        .messages-area { flex: 1; padding: 20px; padding-bottom: 110px !important; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
        .msg-bubble { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 14px; word-break: break-word; will-change: transform, opacity; }
        .msg-bubble.incoming { background: #2c2c2e; align-self: flex-start; }
        .msg-bubble.outgoing { background: #007aff; align-self: flex-end; }
        .msg-bubble img { max-width: 100%; border-radius: 6px; }

        .input-bar { position: absolute !important; bottom: 0 !important; left: 0 !important; right: 0 !important; z-index: 999999 !important; background: #1c1c1e !important; padding: 12px 16px !important; display: flex !important; gap: 10px !important; align-items: center !important; border-top: 1px solid #2c2c2e; box-sizing: border-box !important; }
        .input-bar input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #2c2c2e; background: #0e0e0e; color: #fff; outline: none; }
        .input-bar button { padding: 12px 20px; background: #007aff; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; }

        #admin-call-box { background: #1c1c1e; padding: 12px 16px; border-bottom: 1px solid #2c2c2e; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; transform: translateZ(0); }
        .call-action-btn { padding: 8px 16px; border-radius: 6px; border: none; color: white; font-weight: bold; cursor: pointer; touch-action: manipulation; }
        .delete-thread-btn { background: rgba(255, 59, 48, 0.2); color: #ff3b30; border: 1px solid #ff3b30; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; touch-action: manipulation; }
        .delete-thread-btn:hover { background: #ff3b30; color: #fff; }
    </style>
</head>
<body>

    <!-- LOGIN CONTAINER -->
    <div id="login-screen">
        <div class="login-box">
            <h3>Admin Panel Login</h3>
            <input type="password" id="adminPassword" placeholder="Enter admin password">
            <button id="loginBtn" onclick="loginAdmin()">Login</button>
            <div id="loginError" style="color: #ff3b30; font-size: 12px; margin-top: 10px; display: none;"></div>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="admin-panel">
        <div class="sidebar">
            <div class="sidebar-header">
                <input type="text" id="userSearch" placeholder="Search visitors..." oninput="filterVisitors()">
            </div>
            <div class="visitor-list" id="visitorListContainer"></div>
        </div>

        <div class="main-chat">
            <div class="chat-header">
                <div>
                    <h3 id="currentVisitorEmail">Select a visitor</h3>
                    <span id="currentVisitorStatus" style="font-size:12px; color:#8e8e93;">---</span>
                </div>
                <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                    <button onclick="adminCallVisitor()" class="call-action-btn" style="background:#007aff;">Call Visitor 📞</button>
                    <button onclick="deleteCurrentConversation()" class="delete-thread-btn" id="deleteChatBtn" style="display:none;">Delete Chat</button>
                </div>
            </div>

            <div id="admin-call-box">
                <div>
                    <strong>Call Control:</strong> <span id="callStateLabel">Idle</span>
                </div>
                <div id="callControlButtons">
                    <button onclick="adminAcceptCall()" class="call-action-btn" style="background:#34c759; display:none;" id="acceptBtn">Accept Call</button>
                    <button onclick="adminRejectCall()" class="call-action-btn" style="background:#ff3b30; display:none;" id="rejectBtn">Decline</button>
                </div>
                <div style="display:flex; align-items:center; gap:8px;">
                    <label style="font-size:12px;">Inject Moment:</label>
                    <input type="file" id="videoMomentInput" accept="video/*" onchange="uploadAndInjectVideo(this)" style="font-size:12px;">
                    <button onclick="hangUpCall()" class="call-action-btn" style="background:#ff3b30;">End Call</button>
                </div>
            </div>

            <div class="messages-area" id="adminMessagesArea"></div>

            <div class="input-bar">
                <label style="cursor:pointer; font-size:20px;">📷<input type="file" accept="image/*" style="display:none;" onchange="sendAdminImage(this)"></label>
                <input type="text" id="adminMsgInput" placeholder="Type a message..." onkeypress="handleAdminKeypress(event)">
                <button onclick="sendAdminText()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io({ pingTimeout: 60000, pingInterval: 25000, transports: ['websocket', 'polling'] });
        let selectedVisitorEmail = null;
        let allVisitors = [];
        let callStartTime = null;
        let unreadCounts = {};
        let offlineQueue = JSON.parse(localStorage.getItem('smokyOfflineQueue')) || [];

        socket.on('connect', () => {
            if (offlineQueue.length > 0) {
                offlineQueue.forEach(msg => socket.emit('send-message', msg));
                offlineQueue = [];
                localStorage.removeItem('smokyOfflineQueue');
            }
        });

        const notificationBeep = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJ_u3+Wb6Z1pknVpUwsjK0N0enV1eHqDgoODgoOHh4aHg4OEhoWFiYiIiJiYmJiYmJicnJycno2NjY6Ojo6Pjo6QkJGRkZKSkpSUlJWVlZZWVla2trb39/f4+Pj8/Pz+/v8A');
        
        async function loginAdmin() {
            const password = document.getElementById('adminPassword').value;
            const btn = document.getElementById('loginBtn');
            const errBox = document.getElementById('loginError');
            btn.innerText = "Authenticating...";
            errBox.style.display = 'none';
            socket.emit('admin-login', { password });
        }

        socket.on('admin-authenticated', (res) => {
            if (res.success) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'flex';
            } else {
                document.getElementById('loginError').innerText = res.message;
                document.getElementById('loginError').style.display = 'block';
                document.getElementById('loginBtn').innerText = "Login";
            }
        });

        socket.on('admin-visitor-list', (users) => {
            allVisitors = users;
            renderVisitorList(users);
        });

        function renderVisitorList(users) {
            const container = document.getElementById('visitorListContainer');
            container.innerHTML = '';
            if (users.length === 0) {
                container.innerHTML = '<div style="padding: 20px; text-align: center; color: #8e8e93;">No visitors connected yet.</div>';
                return;
            }
            users.forEach(u => {
                const card = document.createElement('div');
                card.className = `visitor-card ${selectedVisitorEmail === u.email ? 'active' : ''}`;
                card.onclick = () => selectVisitor(u);
                const unreadBadge = unreadCounts[u.email] ? `<span style="background:#007aff; color:#fff; border-radius:50%; padding:2px 6px; font-size:10px; margin-left:6px;">${unreadCounts[u.email]}</span>` : '';
                card.innerHTML = `<div style="overflow:hidden;"><div style="font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px;">${u.email} ${unreadBadge}</div><div style="font-size:12px; color:#8e8e93;">${u.lastSeen}</div></div><div class="status-dot ${u.isOnline ? 'online' : ''}"></div>`;
                container.appendChild(card);
            });
        }

        function filterVisitors() {
            const q = document.getElementById('userSearch').value.toLowerCase();
            renderVisitorList(allVisitors.filter(u => u.email.toLowerCase().includes(q)));
        }

        function selectVisitor(user) {
            selectedVisitorEmail = user.email;
            unreadCounts[user.email] = 0;
            document.getElementById('currentVisitorEmail').innerText = user.email;
            document.getElementById('currentVisitorStatus').innerText = user.isOnline ? 'Online' : user.lastSeen;
            document.getElementById('deleteChatBtn').style.display = 'block';
            renderVisitorList(allVisitors);
            socket.emit('request-visitor-history', { email: user.email });
        }

        socket.on('admin-visitor-history', (data) => {
            if (data.email === selectedVisitorEmail) {
                const area = document.getElementById('adminMessagesArea');
                area.innerHTML = '';
                data.messages.forEach(msg => appendAdminMessage(msg));
            }
        });

        function sendAdminText() {
            const input = document.getElementById('adminMsgInput');
            if (!input.value.trim() || !selectedVisitorEmail) return;
            const msgObj = { email: selectedVisitorEmail, sender: 'admin', type: 'text', content: input.value };
            socket.emit('send-message', msgObj);
            input.value = '';
        }

        function handleAdminKeypress(e) { if (e.key === 'Enter') sendAdminText(); }

        function sendAdminImage(input) {
            const file = input.files[0];
            if (!file || !selectedVisitorEmail) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                socket.emit('send-message', { email: selectedVisitorEmail, sender: 'admin', type: 'image', content: e.target.result });
            };
            reader.readAsDataURL(file);
        }

        socket.on('receive-message', (msg) => {
            if (msg.email === selectedVisitorEmail) {
                appendAdminMessage(msg);
            } else {
                unreadCounts[msg.email] = (unreadCounts[msg.email] || 0) + 1;
                renderVisitorList(allVisitors);
            }
        });

        function appendAdminMessage(msg) {
            const area = document.getElementById('adminMessagesArea');
            const bubble = document.createElement('div');
            bubble.className = `msg-bubble ${msg.sender === 'admin' ? 'outgoing' : 'incoming'}`;
            bubble.innerHTML = msg.type === 'text' ? msg.content : `<img src="${msg.content}"/>`;
            area.appendChild(bubble);
            area.scrollTop = area.scrollHeight;
        }

        function deleteCurrentConversation() {
            if (!selectedVisitorEmail || !confirm(`Delete conversation for ${selectedVisitorEmail}?`)) return;
            socket.emit('delete-conversation', { email: selectedVisitorEmail });
            document.getElementById('adminMessagesArea').innerHTML = '';
            document.getElementById('currentVisitorEmail').innerText = 'Select a visitor';
            selectedVisitorEmail = null;
        }

        async function adminCallVisitor() {
            if (!selectedVisitorEmail) return alert("Select a visitor first");
            socket.emit('initiate-call', { from: 'admin', toEmail: selectedVisitorEmail });
        }

        socket.on('incoming-call-from-visitor', (data) => {
            selectedVisitorEmail = data.email;
            document.getElementById('currentVisitorEmail').innerText = data.email;
            document.getElementById('callStateLabel').innerText = `Incoming call from ${data.email}`;
            document.getElementById('acceptBtn').style.display = 'inline-block';
            document.getElementById('rejectBtn').style.display = 'inline-block';
        });

        function adminAcceptCall() {
            document.getElementById('acceptBtn').style.display = 'none';
            document.getElementById('rejectBtn').style.display = 'none';
            document.getElementById('callStateLabel').innerText = "Connected.";
            callStartTime = Date.now();
            socket.emit('accept-call', { targetEmail: selectedVisitorEmail, acceptedBy: 'admin' });
        }

        function uploadAndInjectVideo(input) {
            const file = input.files[0];
            if (!file || !selectedVisitorEmail) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                socket.emit('inject-video', { targetEmail: selectedVisitorEmail, videoData: e.target.result });
            };
            reader.readAsDataURL(file);
        }

        function hangUpCall() {
            socket.emit('hang-up', { email: selectedVisitorEmail, duration: 0 });
            document.getElementById('callStateLabel').innerText = "Idle";
        }
    </script>
</body>
</html>
