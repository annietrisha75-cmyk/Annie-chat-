<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Control Center</title>
    <style>
        body { background: #0b0b0b; color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #141414; padding: 15px 20px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        h1 { margin: 0; font-size: 1.1rem; letter-spacing: 1px; color: #d4af37; text-transform: uppercase; }
        .translator-badge { font-size: 0.75rem; background: rgba(212, 175, 55, 0.1); color: #d4af37; padding: 4px 8px; border-radius: 12px; border: 1px solid rgba(212, 175, 55, 0.3); }
        .main-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* Sidebar / Thread list */
        .sidebar { width: 320px; border-right: 1px solid #222; overflow-y: auto; background: #0f0f0f; display: flex; flex-direction: column; }
        .thread-wrapper { position: relative; overflow: hidden; border-bottom: 1px solid #1a1a1a; }
        .thread-item { padding: 15px; cursor: pointer; transition: background 0.2s; background: #0f0f0f; position: relative; z-index: 2; width: 100%; box-sizing: border-box; }
        .thread-item:hover, .thread-item.active { background: #1c1c1c; }
        .thread-email { font-weight: 600; font-size: 0.9rem; color: #fff; margin-bottom: 4px; }
        .thread-preview { font-size: 0.75rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* Delete Action behind swipe */
        .delete-action { position: absolute; right: 0; top: 0; bottom: 0; width: 90px; background: #ff3b30; color: white; display: flex; justify-content: center; align-items: center; font-weight: 600; font-size: 0.85rem; cursor: pointer; z-index: 1; }

        /* Chat Area */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #050505; position: relative; }
        .back-btn-container { display: none; padding: 10px 15px; background: #111; border-bottom: 1px solid #222; }
        .back-btn { background: #222; color: #d4af37; border: 1px solid #333; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: 600; }
        
        .chat-header { padding: 12px 20px; background: #111; border-bottom: 1px solid #222; font-size: 0.85rem; color: #aaa; }
        .chat-header span { color: #d4af37; font-weight: 500; }
        .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; line-height: 1.4; position: relative; }
        .message.owner { background: #d4af37; color: #000; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message.user { background: #1f1f1f; color: #fff; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #2c2c2c; }
        .translation-tag { font-size: 0.7rem; opacity: 0.8; margin-bottom: 4px; display: block; border-bottom: 1px dashed rgba(0,0,0,0.2); padding-bottom: 2px; }
        .message.user .translation-tag { border-bottom: 1px dashed rgba(255,255,255,0.2); color: #d4af37; }
        
        .input-area { padding: 15px 20px; background: #111; border-top: 1px solid #222; display: flex; gap: 10px; align-items: center; }
        input[type="text"] { flex: 1; background: #1a1a1a; border: 1px solid #333; padding: 12px 16px; border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; }
        input[type="text"]:focus { border-color: #d4af37; }
        button.send-btn { background: #d4af37; color: #000; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }

        /* Responsive Mobile Layout switching */
        @media (max-width: 768px) {
            .sidebar { width: 100%; height: 100%; position: absolute; z-index: 5; transition: transform 0.3s ease; }
            .sidebar.hidden { transform: translateX(-100%); }
            .chat-area { width: 100%; height: 100%; position: absolute; z-index: 4; }
            .chat-area.hidden { display: none; }
            .back-btn-container { display: block; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Owner Control Center</h1>
        <div class="translator-badge">🌐 Auto-Translator Active</div>
    </header>
    <div class="main-container">
        <div class="sidebar" id="sidebar">
            <div id="threadsList"></div>
        </div>
        <div class="chat-area hidden" id="chatArea">
            <div class="back-btn-container">
                <button class="back-btn" onclick="showThreadsList()">← Back to Threads</button>
            </div>
            <div class="chat-header">Active Thread: <span id="activeThreadEmail">Select a conversation</span></div>
            <div class="messages-container" id="messagesContainer">
                <div style="color: #666; text-align: center; margin: auto;">Select a user thread to view messages.</div>
            </div>
            <div class="input-area">
                <input type="text" id="replyInput" placeholder="Reply as owner..." autocomplete="off">
                <button class="send-btn" onclick="sendReply()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let currentEmail = null;
        let lastMessageCount = 0;

        async function loadThreads() {
            try {
                const res = await fetch('/api/admin/threads');
                const threads = await res.json();
                const list = document.getElementById('threadsList');
                list.innerHTML = '';
                
                if (threads.length === 0) {
                    list.innerHTML = '<div style="padding: 30px; color: #666; text-align: center;">No active user sessions</div>';
                    return;
                }

                threads.forEach(t => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'thread-wrapper';

                    const deleteDiv = document.createElement('div');
                    deleteDiv.className = 'delete-action';
                    deleteDiv.textContent = 'Delete';
                    deleteDiv.onclick = (e) => {
                        e.stopPropagation();
                        deleteThread(t.email);
                    };

                    const div = document.createElement('div');
                    div.className = `thread-item ${currentEmail === t.email ? 'active' : ''}`;
                    div.innerHTML = `
                        <div class="thread-email">${t.email}</div>
                        <div class="thread-preview">${t.lastMessage || 'No messages yet'}</div>
                    `;
                    div.onclick = () => selectThread(t.email);

                    // Swipe gesture logic for mobile & touch
                    let startX = 0;
                    div.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; });
                    div.addEventListener('touchmove', (e) => {
                        let diff = startX - e.touches[0].clientX;
                        if (diff > 40) {
                            div.style.transform = 'translateX(-90px)';
                            div.style.transition = 'transform 0.2s ease';
                        } else if (diff < -10) {
                            div.style.transform = 'translateX(0)';
                        }
                    });

                    wrapper.appendChild(deleteDiv);
                    wrapper.appendChild(div);
                    list.appendChild(wrapper);
                });
            } catch (err) {
                console.error('Failed to load threads:', err);
            }
        }

        function selectThread(email) {
            currentEmail = email;
            document.getElementById('activeThreadEmail').textContent = email;
            lastMessageCount = 0;
            loadMessages(true);
            
            // Switch view on mobile
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.add('hidden');
                document.getElementById('chatArea').classList.remove('hidden');
            }
        }

        function showThreadsList() {
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('chatArea').classList.add('hidden');
            currentEmail = null;
        }

        async function deleteThread(email) {
            if (!confirm(`Are you sure you want to delete conversation with ${email}?`)) return;
            try {
                const res = await fetch(`/api/admin/thread?email=${encodeURIComponent(email)}`, { method: 'DELETE' });
                if (res.ok) {
                    if (currentEmail === email) showThreadsList();
                    loadThreads();
                }
            } catch (err) {
                console.error('Failed to delete thread:', err);
            }
        }

        async function loadMessages(forceScroll = false) {
            if (!currentEmail) return;
            try {
                const res = await fetch(`/api/admin/messages?email=${encodeURIComponent(currentEmail)}`);
                const messages = await res.json();
                const container = document.getElementById('messagesContainer');
                
                // Only redraw if message length changes to keep keyboard open and focused
                if (messages.length !== lastMessageCount || forceScroll) {
                    lastMessageCount = messages.length;
                    container.innerHTML = '';
                    
                    if (messages.length === 0) {
                        container.innerHTML = '<div style="color: #666; text-align: center; margin: auto;">No messages in this thread yet.</div>';
                        return;
                    }

                    messages.forEach(m => {
                        const msgDiv = document.createElement('div');
                        msgDiv.className = `message ${m.sender}`;
                        let translationHTML = m.sender === 'user' 
                            ? `<span class="translation-tag">🔵 Auto-Translated to English</span>` 
                            : `<span class="translation-tag">🟢 Auto-Translated to User Language</span>`;
                        msgDiv.innerHTML = `${translationHTML}${m.text}`;
                        container.appendChild(msgDiv);
                    });
                    container.scrollTop = container.scrollHeight;
                }
            } catch (err) {
                console.error('Failed to load messages:', err);
            }
        }

        async function sendReply() {
            const input = document.getElementById('replyInput');
            const text = input.value.trim();
            if (!text || !currentEmail) return;
            input.value = '';

            try {
                const res = await fetch('/api/admin/reply', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, text })
                });
                if (res.ok) loadMessages(true);
            } catch (err) {
                console.error('Failed to send reply:', err);
            }
        }

        document.getElementById('replyInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendReply();
        });

        setInterval(loadThreads, 4000);
        setInterval(() => loadMessages(false), 3000);
        loadThreads();
    </script>
</body>
</html>
