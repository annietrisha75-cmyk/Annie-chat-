<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0d1117; color: #c9d1d9; height: 100vh; display: flex; }
        
        #loginModal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .modal-box { background: #161b22; padding: 24px; border-radius: 12px; border: 1px solid #30363d; text-align: center; width: 300px; }
        .modal-box input { width: 100%; padding: 10px; margin: 12px 0; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 6px; }
        .modal-box button { width: 100%; padding: 10px; background: #238636; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; }

        #sidebar { width: 260px; background: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; }
        #sidebar h3 { padding: 16px; border-bottom: 1px solid #30363d; }
        .visitor-item { padding: 12px 16px; border-bottom: 1px solid #21262d; cursor: pointer; }
        .visitor-item.active { background: #1f6feb22; color: #58a6ff; font-weight: bold; }
        
        #main { flex: 1; display: flex; flex-direction: column; }
        #chatHeader { padding: 16px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        #adminVideoArea { display: none; height: 200px; background: #000; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #adminLocalVideo { position: absolute; right: 10px; bottom: 10px; width: 80px; height: 90px; border: 2px solid #238636; border-radius: 6px; }
        
        #chatBox { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 70%; padding: 8px 12px; border-radius: 8px; font-size: 14px; }
        .msg.admin { align-self: flex-end; background: #238636; color: white; }
        .msg.visitor { align-self: flex-start; background: #21262d; color: white; }
        
        #inputArea { padding: 12px; background: #161b22; border-top: 1px solid #30363d; display: flex; gap: 8px; }
        #inputArea input { flex: 1; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 6px; }
        #inputArea button { padding: 10px 16px; background: #1f6feb; border: none; color: white; border-radius: 6px; cursor: pointer; }
        .call-btn { background: #238636; border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .end-btn { background: #da3633; border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="loginModal">
        <div class="modal-box">
            <h2>Admin Login</h2>
            <input type="password" id="passInput" placeholder="Enter Password" />
            <button onclick="login()">Access Panel</button>
            <p id="errTxt" style="color: #f85149; font-size: 12px; margin-top: 8px; display: none;">Invalid Password</p>
        </div>
    </div>

    <div id="sidebar">
        <h3>Active Visitors</h3>
        <div id="visitorList"></div>
    </div>

    <div id="main">
        <div id="chatHeader">
            <span id="targetLabel">Select a visitor to start</span>
            <button id="adminCallBtn" class="call-btn" style="display:none;" onclick="toggleAdminCall()">Start Video</button>
        </div>

        <div id="adminVideoArea">
            <video id="adminRemoteVideo" autoplay playsinline></video>
            <video id="adminLocalVideo" autoplay playsinline muted></video>
        </div>

        <div id="chatBox"></div>

        <div id="inputArea">
            <input type="text" id="adminMsg" placeholder="Type response..." onkeypress="if(event.key==='Enter') sendAdminMsg()" />
            <button onclick="sendAdminMsg()">Send</button>
        </div>
    </div>

    <script>
        const socket = io();
        let selectedVisitorId = null;
        let localStream = null;
        let peerConnection = null;
        let inCall = false;

        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        function login() {
            const pwd = document.getElementById('passInput').value;
            // Admin authentication check (Password: felix123)
            if (pwd === 'felix123') {
                socket.emit('admin_login', { password: pwd });
            } else {
                document.getElementById('errTxt').style.display = 'block';
            }
        }

        socket.on('admin_auth_success', () => {
            document.getElementById('loginModal').style.display = 'none';
        });

        socket.on('admin_auth_failure', () => {
            document.getElementById('errTxt').style.display = 'block';
        });

        socket.on('visitor_list_update', (visitors) => {
            const list = document.getElementById('visitorList');
            list.innerHTML = '';
            visitors.forEach(vId => {
                const item = document.createElement('div');
                item.className = `visitor-item ${vId === selectedVisitorId ? 'active' : ''}`;
                item.textContent = vId;
                item.onclick = () => selectVisitor(vId);
                list.appendChild(item);
            });
        });

        function selectVisitor(vId) {
            selectedVisitorId = vId;
            document.getElementById('targetLabel').textContent = 'Chatting with: ' + vId;
            document.getElementById('adminCallBtn').style.display = 'inline-block';
            socket.emit('admin_get_history', { visitorId: vId });
        }

        socket.on('admin_chat_history', ({ visitorId, history }) => {
            if (visitorId === selectedVisitorId) {
                const box = document.getElementById('chatBox');
                box.innerHTML = '';
                history.forEach(renderMsg);
                box.scrollTop = box.scrollHeight;
            }
        });

        socket.on('new_message', (msg) => {
            if (msg.visitor_id === selectedVisitorId) {
                renderMsg(msg);
                const box = document.getElementById('chatBox');
                box.scrollTop = box.scrollHeight;
            }
        });

        function renderMsg(msg) {
            const box = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `msg ${msg.sender === 'admin' ? 'admin' : 'visitor'}`;
            div.textContent = msg.text;
            box.appendChild(div);
        }

        function sendAdminMsg() {
            if (!selectedVisitorId) return alert('Select a visitor first');
            const input = document.getElementById('adminMsg');
            const text = input.value.trim();
            if (!text) return;

            socket.emit('send_message', {
                visitorId: selectedVisitorId,
                text: text,
                sender: 'admin'
            });

            input.value = '';
        }

        // WebRTC & Call Cleanup Methods
        async function startAdminCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('adminLocalVideo').srcObject = localStream;
                document.getElementById('adminVideoArea').style.display = 'block';
            } catch (e) {
                alert('Camera Error: ' + e.message);
                throw e;
            }
        }

        async function toggleAdminCall() {
            if (!selectedVisitorId) return;
            if (inCall) {
                endAdminCall(true);
            } else {
                await startAdminCamera();
                createAdminPeerConnection();
                localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('signal', { targetVisitorId: selectedVisitorId, signal: offer });
                
                inCall = true;
                updateAdminCallUI(true);
            }
        }

        function createAdminPeerConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);
            peerConnection.onicecandidate = (e) => {
                if (e.candidate) {
                    socket.emit('signal', { targetVisitorId: selectedVisitorId, signal: { candidate: e.candidate } });
                }
            };
            peerConnection.ontrack = (e) => {
                document.getElementById('adminRemoteVideo').srcObject = e.streams[0];
            };
        }

        socket.on('signal', async (data) => {
            if (data.signal.sdp) {
                if (!peerConnection) {
                    await startAdminCamera();
                    createAdminPeerConnection();
                    localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
                }
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal));
                if (data.signal.type === 'offer') {
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    socket.emit('signal', { targetVisitorId: selectedVisitorId, signal: answer });
                    inCall = true;
                    updateAdminCallUI(true);
                }
            } else if (data.signal.candidate && peerConnection) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.signal.candidate));
            }
        });

        socket.on('end_call', () => {
            endAdminCall(false);
        });

        // Comprehensive WebRTC track cleanup routine
        function endAdminCall(notifyPeer = true) {
            if (notifyPeer && selectedVisitorId) {
                socket.emit('end_call', { targetVisitorId: selectedVisitorId });
            }

            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            if (peerConnection) {
                peerConnection.ontrack = null;
                peerConnection.onicecandidate = null;
                peerConnection.close();
                peerConnection = null;
            }

            document.getElementById('adminLocalVideo').srcObject = null;
            document.getElementById('adminRemoteVideo').srcObject = null;
            document.getElementById('adminVideoArea').style.display = 'none';

            inCall = false;
            updateAdminCallUI(false);
        }

        function updateAdminCallUI(active) {
            const btn = document.getElementById('adminCallBtn');
            btn.textContent = active ? 'End Video' : 'Start Video';
            btn.className = active ? 'end-btn' : 'call-btn';
        }
    </script>
</body>
</html>
