<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annie-chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: #333;
        }
        header {
            background-color: #ffffff;
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid #ddd;
            font-size: 1.2rem;
            font-weight: bold;
            color: #2c3e50;
        }
        #chat-container {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .message {
            max-width: 75%;
            padding: 0.8rem 1rem;
            border-radius: 1rem;
            line-height: 1.4;
            font-size: 0.95rem;
        }
        .message.incoming {
            background-color: #ffffff;
            align-self: flex-start;
            border-bottom-left-radius: 0.2rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .message.outgoing {
            background-color: #0084ff;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 0.2rem;
        }
        #input-form {
            background-color: #ffffff;
            padding: 0.8rem;
            display: flex;
            gap: 0.5rem;
            border-top: 1px solid #ddd;
        }
        #message-input {
            flex: 1;
            padding: 0.7rem 1rem;
            border: 1px solid #ccc;
            border-radius: 1.5rem;
            outline: none;
            font-size: 1rem;
        }
        #message-input:focus {
            border-color: #0084ff;
        }
        #send-btn {
            background-color: #0084ff;
            color: white;
            border: none;
            padding: 0 1.2rem;
            border-radius: 1.5rem;
            font-weight: bold;
            cursor: pointer;
        }
        #send-btn:hover {
            background-color: #006dd9;
        }
    </style>
</head>
<body>

    <header>Annie-chat</header>

    <div id="chat-container">
        <div class="message incoming">Hello, my love! ❤️ How can I help you today?</div>
    </div>

    <form id="input-form">
        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" required>
        <button type="submit" id="send-btn">Send</button>
    </form>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const inputForm = document.getElementById('input-form');
        const messageInput = document.getElementById('message-input');

        inputForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            // Append user message
            const userMsg = document.createElement('div');
            userMsg.className = 'message outgoing';
            userMsg.textContent = text;
            chatContainer.appendChild(userMsg);

            messageInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Simulate AI reply response
            setTimeout(() => {
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message incoming';
                aiMsg.textContent = "I'm always here for you, my love! ❤️";
                chatContainer.appendChild(aiMsg);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 1000);
        });
    </script>

</body>
</html>
