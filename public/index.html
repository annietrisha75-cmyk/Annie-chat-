<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annie-chat</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f0f2f5; display: flex; flex-direction: column; height: 100vh; color: #333; }
        header { background-color: #ffffff; padding: 1rem; text-align: center; border-bottom: 1px solid #ddd; font-size: 1.2rem; font-weight: bold; color: #2c3e50; }
        #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 10; }
        .modal-box { background: white; padding: 2rem; border-radius: 1rem; width: 90%; max-width: 400px; text-align: center; }
        .modal-box input { width: 100%; padding: 0.8rem; margin: 1rem 0; border: 1px solid #ccc; border-radius: 0.5rem; font-size: 1rem; }
        .modal-box button { background: #0084ff; color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 0.5rem; font-weight: bold; cursor: pointer; width: 100%; }
        #chat-container { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.8rem; }
        .message { max-width: 75%; padding: 0.8rem 1rem; border-radius: 1rem; line-height: 1.4; font-size: 0.95rem; word-break: break-word; }
        .message.incoming { background-color: #ffffff; align-self: flex-start; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .message.outgoing { background-color: #0084ff; color: #ffffff; align-self: flex-end; }
        #input-form { background-color: #ffffff; padding: 0.8rem; display: flex; gap: 0.5rem; border-top: 1px solid #ddd; }
        #message-input { flex: 1; padding: 0.7rem 1rem; border: 1px solid #ccc; border-radius: 1.5rem; outline: none; }
        #send-btn { background-color: #0084ff; color: white; border: none; padding: 0 1.2rem; border-radius: 1.5rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="modal">
        <div class="modal-box">
            <h2>Annie-chat</h2>
            <p style="margin-top: 0.5rem; color: #666; font-size: 0.9rem;">Enter your email to connect and keep your secure chat saved on your phone forever.</p>
            <input type="email" id="email-input" placeholder="Enter your email..." required>
            <button id="start-btn">Start Chatting</button>
        </div>
    </div>

    <header>Annie-chat</header>

    <div id="chat-container"></div>

    <form id="input-form">
        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" required>
        <button type="submit" id="send-btn">Send</button>
    </form>

    <script>
        let userEmail = localStorage.getItem('annie_user_email');
        const modal = document.getElementById('modal');
        const chatContainer = document.getElementById('chat-container');
        const inputForm = document.getElementById('input-form');
        const messageInput = document.getElementById('message-input');

        const urlParams = new URLSearchParams(window.location.search);
        const paramEmail = urlParams.get('email');
        if (paramEmail) {
            userEmail = paramEmail;
            localStorage.setItem('annie_user_email', userEmail);
        }

        if (userEmail) {
            modal.style.display = 'none';
            loadMessages();
        }

        document.getElementById('start-btn').addEventListener('click', async () => {
            const email = document.getElementById('email-input').value.trim();
            if (!email) return;

            await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            localStorage.setItem('annie_user_email', email);
            userEmail = email;
            modal.style.display = 'none';
            loadMessages();
        });

        async function loadMessages() {
            if (!userEmail) return;
            const res = await fetch(`/api/messages/${userEmail}`);
            const messages = await res.json();
            chatContainer.innerHTML = '';
            messages.forEach(msg => {
                appendMessage(msg.text, msg.sender === 'user' ? 'outgoing' : 'incoming');
            });
        }

        function appendMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        inputForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text || !userEmail) return;

            appendMessage(text, 'outgoing');
            messageInput.value = '';

            await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: userEmail, text, sender: 'user' })
            });
        });

        setInterval(loadMessages, 3000);
    </script>
</body>
</html>
