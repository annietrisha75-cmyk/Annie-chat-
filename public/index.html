<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Messenger</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; display: flex; flex-direction: column; height: 100vh; color: #f8fafc; }
        header { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 1rem; text-align: center; border-bottom: 1px solid #334155; font-size: 1.25rem; font-weight: 700; letter-spacing: 0.5px; color: #38bdf8; display: flex; justify-content: center; align-items: center; gap: 8px; }
        
        #modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .modal-box { background: #1e293b; padding: 2.5rem 2rem; border-radius: 1.5rem; width: 90%; max-width: 420px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); border: 1px solid #334155; }
        .modal-box h2 { color: #f8fafc; margin-bottom: 0.5rem; font-size: 1.5rem; }
        .modal-box p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .modal-box input { width: 100%; padding: 0.9rem 1rem; margin-bottom: 1rem; background: #0f172a; border: 1px solid #475569; border-radius: 0.75rem; color: white; font-size: 1rem; outline: none; }
        .modal-box input:focus { border-color: #38bdf8; }
        .modal-box button { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; border: none; padding: 0.9rem; border-radius: 0.75rem; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; transition: opacity 0.2s; }
        .modal-box button:hover { opacity: 0.9; }

        #chat-container { flex: 1; padding: 1.2rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; background: #0b0f19; }
        .message-wrapper { display: flex; flex-direction: column; max-width: 75%; }
        .message-wrapper.incoming { align-self: flex-start; }
        .message-wrapper.outgoing { align-self: flex-end; }
        
        .message { padding: 0.85rem 1.1rem; border-radius: 1.2rem; line-height: 1.4; font-size: 0.95rem; word-break: break-word; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .message.incoming { background: #1e293b; color: #f8fafc; border-bottom-left-radius: 0.2rem; }
        .message.outgoing { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; border-bottom-right-radius: 0.2rem; }
        
        .message img { max-width: 100%; border-radius: 0.75rem; margin-top: 0.5rem; cursor: pointer; }
        .timestamp { font-size: 0.7rem; color: #64748b; margin-top: 4px; padding: 0 4px; }
        .incoming .timestamp { align-self: flex-start; }
        .outgoing .timestamp { align-self: flex-end; }

        #input-form { background: #1e293b; padding: 0.8rem 1rem; display: flex; align-items: center; gap: 0.75rem; border-top: 1px solid #334155; }
        #message-input { flex: 1; padding: 0.8rem 1.2rem; background: #0f172a; border: 1px solid #475569; border-radius: 2rem; color: white; outline: none; font-size: 0.95rem; }
        #message-input:focus { border-color: #38bdf8; }
        
        .file-upload-btn { background: none; border: none; color: #94a3b8; font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color 0.2s; }
        .file-upload-btn:hover { color: #38bdf8; }
        #send-btn { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; border: none; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; flex-shrink: 0; }
        
        #preview-container { display: none; padding: 0.5rem 1rem; background: #1e293b; border-top: 1px solid #334155; align-items: center; justify-content: space-between; }
        #preview-container img { height: 50px; border-radius: 6px; }
    </style>
</head>
<body>

    <div id="modal">
        <div class="modal-box">
            <h2 id="modal-title">Private Chat Setup</h2>
            <p>Enter your details to instantly secure your connection and load your permanent chat.</p>
            <input type="text" id="name-input" placeholder="What name do you call me? (e.g. Annie, Craig...)" required>
            <input type="email" id="email-input" placeholder="Enter your email address..." required>
            <button id="start-btn">Start Secure Chat</button>
        </div>
    </div>

    <header id="header-title">Private Chat</header>

    <div id="chat-container"></div>

    <div id="preview-container">
        <div style="display: flex; align-items: center; gap: 10px;">
            <img id="image-preview" src="" alt="Preview">
            <span style="font-size: 0.85rem; color: #94a3b8;">Photo attached</span>
        </div>
        <button type="button" onclick="clearImage()" style="background:none;border:none;color:#ef4444;cursor:pointer;font-weight:bold;">Remove</button>
    </div>

    <form id="input-form">
        <label class="file-upload-btn" title="Send Photo">
            📁
            <input type="file" id="image-input" accept="image/*" style="display: none;">
        </label>
        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
        <button type="submit" id="send-btn">➤</button>
    </form>

    <script>
        let userEmail = localStorage.getItem('pm_user_email');
        let displayName = localStorage.getItem('pm_display_name') || 'Private Chat';
        let base64Image = null;

        const modal = document.getElementById('modal');
        const chatContainer = document.getElementById('chat-container');
        const inputForm = document.getElementById('input-form');
        const messageInput = document.getElementById('message-input');
        const headerTitle = document.getElementById('header-title');

        headerTitle.textContent = displayName;

        const urlParams = new URLSearchParams(window.location.search);
        const paramEmail = urlParams.get('email');
        if (paramEmail) {
            userEmail = paramEmail;
            localStorage.setItem('pm_user_email', userEmail);
        }

        if (userEmail) {
            modal.style.display = 'none';
            loadMessages();
        }

        document.getElementById('start-btn').addEventListener('click', async () => {
            const email = document.getElementById('email-input').value.trim();
            const name = document.getElementById('name-input').value.trim() || 'Private Chat';
            if (!email) return;

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, displayName: name })
            });
            const data = await res.json();

            localStorage.setItem('pm_user_email', email);
            localStorage.setItem('pm_display_name', data.user.displayName);
            userEmail = email;
            displayName = data.user.displayName;
            headerTitle.textContent = displayName;
            
            modal.style.display = 'none';
            loadMessages();
        });

        // Handle image selection
        document.getElementById('image-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                base64Image = uploadEvent.target.result;
                document.getElementById('image-preview').src = base64Image;
                document.getElementById('preview-container').style.display = 'flex';
            };
            reader.readAsDataURL(file);
        });

        function clearImage() {
            base64Image = null;
            document.getElementById('image-input').value = '';
            document.getElementById('preview-container').style.display = 'none';
        }

        async function loadMessages() {
            if (!userEmail) return;
            const res = await fetch(`/api/messages/${userEmail}`);
            const messages = await res.json();
            chatContainer.innerHTML = '';
            messages.forEach(msg => {
                appendMessage(msg.text, msg.image, msg.sender === 'user' ? 'outgoing' : 'incoming', msg.timestamp);
            });
        }

        function appendMessage(text, image, sender, time) {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${sender}`;

            const bubble = document.createElement('div');
            bubble.className = `message ${sender}`;
            
            if (text) {
                const textNode = document.createElement('div');
                textNode.textContent = text;
                bubble.appendChild(textNode);
            }

            if (image) {
                const imgNode = document.createElement('img');
                imgNode.src = image;
                bubble.appendChild(imgNode);
            }

            const timeNode = document.createElement('div');
            timeNode.className = 'timestamp';
            const date = time ? new Date(time) : new Date();
            timeNode.textContent = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            wrapper.appendChild(bubble);
            wrapper.appendChild(timeNode);
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        inputForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if ((!text && !base64Image) || !userEmail) return;

            const currentImage = base64Image;
            appendMessage(text, currentImage, 'outgoing');
            
            messageInput.value = '';
            clearImage();

            await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: userEmail, text, image: currentImage, sender: 'user' })
            });
            loadMessages();
        });

        setInterval(loadMessages, 3000);
    </script>
</body>
</html>
