<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Chat</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.75);
      --border: rgba(212, 175, 55, 0.2);
      --accent: #d4af37;
      --accent-hover: #b38f27;
      --text: #f9fafb;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Setup Modal */
    #setup-modal {
      position: fixed; inset: 0; background: rgba(5,7,12,0.9); backdrop-filter: blur(16px);
      display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
    }
    .modal-box {
      background: var(--card-bg); border: 1px solid var(--border); padding: 36px; border-radius: 24px;
      width: 100%; max-width: 420px; box-shadow: 0 25px 50px rgba(0,0,0,0.7); text-align: center;
    }
    .modal-box h2 { font-size: 26px; margin-bottom: 8px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
    .modal-box p { font-size: 14px; color: var(--text-muted); margin-bottom: 28px; line-height: 1.5; }
    .input-group { margin-bottom: 18px; text-align: left; }
    .input-group label { display: block; font-size: 12px; color: var(--accent); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .input-group input {
      width: 100%; padding: 14px 18px; background: rgba(0,0,0,0.5); border: 1px solid var(--border);
      border-radius: 12px; color: #fff; font-size: 15px; outline: none; transition: border 0.3s;
    }
    .input-group input:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(212,175,55,0.2); }
    .btn-primary {
      width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      border: none; border-radius: 12px; color: #0b0f19; font-size: 16px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4); transition: transform 0.1s; margin-top: 8px;
    }
    .btn-primary:active { transform: scale(0.98); }

    /* Header */
    header {
      background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
      padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; z-index: 10;
    }
    header h1 { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; }
    .status-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block; margin-right: 6px; box-shadow: 0 0 8px #10b981; }

    /* Chat Container */
    #chat-container {
      flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
      background: radial-gradient(circle at top, rgba(212,175,55,0.04) 0%, transparent 70%);
    }
    .message { max-width: 75%; padding: 14px 18px; border-radius: 16px; font-size: 14px; line-height: 1.6; position: relative; word-break: break-word; }
    .message.user { background: linear-gradient(135deg, var(--accent), var(--accent-hover)); color: #0b0f19; align-self: flex-end; border-bottom-right-radius: 4px; font-weight: 500; box-shadow: 0 4px 15px rgba(212,175,55,0.2); }
    .message.admin { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; align-self: flex-start; border-bottom-left-radius: 4px; }
    .message img { max-width: 100%; border-radius: 10px; margin-top: 10px; display: block; border: 1px solid rgba(255,255,255,0.1); }
    .timestamp { font-size: 10px; opacity: 0.7; margin-top: 6px; text-align: right; }

    /* Footer Input Area */
    footer {
      background: rgba(11, 15, 25, 0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--border);
      padding: 16px 24px; display: flex; align-items: center; gap: 14px;
    }
    .file-btn {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); width: 48px; height: 48px;
      border-radius: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--accent);
      font-size: 18px; transition: background 0.2s;
    }
    .file-btn:hover { background: rgba(212,175,55,0.1); }
    input[type="file"] { display: none; }
    .msg-input {
      flex: 1; background: rgba(0,0,0,0.5); border: 1px solid var(--border); padding: 14px 18px;
      border-radius: 14px; color: #fff; font-size: 15px; outline: none; transition: border 0.3s;
    }
    .msg-input:focus { border-color: var(--accent); }
    .send-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-hover)); border: none; width: 48px; height: 48px;
      border-radius: 14px; color: #0b0f19; display: flex; align-items: center; justify-content: center; cursor: pointer;
      font-size: 18px; font-weight: bold; box-shadow: 0 4px 15px rgba(212,175,55,0.3);
    }
  </style>
</head>
<body>

  <!-- Setup Modal -->
  <div id="setup-modal">
    <div class="modal-box">
      <h2>Private Chat</h2>
      <p>Enter your designation and email address to instantly establish your permanent secure link.</p>
      <div class="input-group">
        <label>Your Name</label>
        <input type="text" id="name-input" placeholder="e.g. Craig, Kelvin, Annie...">
      </div>
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="email-input" placeholder="e.g. your@email.com">
      </div>
      <button class="btn-primary" onclick="initSession()">Initialize Secure Link</button>
    </div>
  </div>

  <!-- Header -->
  <header>
    <h1>Private Chat</h1>
    <div style="display:flex; align-items:center; font-size:12px; color:var(--text-muted);">
      <span class="status-dot"></span> Secure Connection Active
    </div>
  </header>

  <!-- Message Log -->
  <div id="chat-container"></div>

  <!-- Footer Input -->
  <footer>
    <label class="file-btn" title="Upload Photo">
      📷
      <input type="file" id="image-input" accept="image/*" onchange="handleImage(event)">
    </label>
    <input type="text" class="msg-input" id="message-input" placeholder="Type a secure message..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button class="send-btn" onclick="sendMessage()">➤</button>
  </footer>

  <script>
    let currentUser = JSON.parse(localStorage.getItem('private_chat_user') || 'null');
    let base64Image = '';

    window.onload = () => {
      if (currentUser) {
        document.getElementById('setup-modal').style.display = 'none';
        loadMessages();
        setInterval(loadMessages, 3000);
      }
    };

    async function initSession() {
      const name = document.getElementById('name-input').value.trim();
      const email = document.getElementById('email-input').value.trim();
      if (!name || !email) return alert('Please enter both your name and email address.');

      const res = await fetch('/api/session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email })
      });
      const data = await res.json();
      if (data.success) {
        currentUser = data.session;
        localStorage.setItem('private_chat_user', JSON.stringify(currentUser));
        document.getElementById('setup-modal').style.display = 'none';
        loadMessages();
        setInterval(loadMessages, 3000);
      } else {
        alert(data.error);
      }
    }

    async function loadMessages() {
      if (!currentUser) return;
      const res = await fetch(`/api/messages/${currentUser.email}`);
      const messages = await res.json();
      const container = document.getElementById('chat-container');
      
      container.innerHTML = messages.map(m => `
        <div class="message ${m.sender === currentUser.name ? 'user' : 'admin'}">
          <div style="font-size:11px; font-weight:600; margin-bottom:2px; opacity:0.8;">${m.sender}</div>
          <div>${m.text}</div>
          ${m.image ? `<img src="${m.image}" />` : ''}
          <div class="timestamp">${new Date(m.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
        </div>
      `).join('');
      container.scrollTop = container.scrollHeight;
    }

    function handleImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onloadend = () => {
        base64Image = reader.result;
        sendMessage();
      };
      reader.readAsDataURL(file);
    }

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text && !base64Image) return;

      await fetch('/api/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: currentUser.email,
          sender: currentUser.name,
          text: text,
          image: base64Image
        })
      });

      input.value = '';
      base64Image = '';
      loadMessages();
    }
  </script>
</body>
</html>
